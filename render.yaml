
services:
  - type: web
    name: stresssense-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /api/health

    buildCommand: |
      pip install -r requirements.txt
      python app/services/download_model.py

    startCommand: python app/services/seed_questions.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stresssense-db
          property: connectionString

      - key: CORS_ORIGINS
        value: "https://stresssense-nine.vercel.app"

      - key: FIREBASE_CREDENTIALS
        sync: false

databases:
  - name: stresssense-db
    plan: free
    databaseName: stresssense
    user: stresssense_user